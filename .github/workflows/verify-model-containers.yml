name: Verify actual model-service image runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-model-containers.yml', 'submission/evidence/model-container-review-2026-10-02.json']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Import actual image code offline and record resolved dependencies
        run: |
          mkdir runtime-evidence
          for service in asr text_service; do
            image=$(jq -r --arg name "pauseam-$service" '.images[$name]' submission/evidence/model-container-review-2026-10-02.json)
            docker pull "$image"
            docker run --rm --network none --read-only --tmpfs /tmp:size=128m --entrypoint python "$image" -c 'import app, torch, transformers, json; print(json.dumps({"model": app.MODEL, "revision": app.REVISION, "torch": torch.__version__, "transformers": transformers.__version__, "cudaAvailable": torch.cuda.is_available(), "inferencePerformed": False}))' | tee "runtime-evidence/$service-import.json"
            docker run --rm --network none --read-only --entrypoint python "$image" -m pip freeze > "runtime-evidence/$service-requirements.lock.txt"
          done
      - name: Save genuine runtime evidence; no weights, credentials or audio
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actual-model-container-runtime
          path: runtime-evidence
          retention-days: 30
