services:
  gateway:
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    ports: ["80:80", "443:443"]
    volumes: ["caddy-data:/data", "caddy-config:/config"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/Caddyfile <<'CADDYFILE'
          $DOMAIN_NAME {
            request_body {
              max_size 1MB
            }
            header Cache-Control "no-store"
            handle_path /asr/en/* {
              reverse_proxy asr-en:8000
            }
            handle {
              respond "PauseAm model gateway" 404
            }
          }
        CADDYFILE
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
  asr-en:
    image: ghcr.io/thepopeblack-byte/pauseam-asr@sha256:7f986b28e1beea961591d55ef435c0acb12434089b7628823281b8b62f3aba7b
    restart: "on-failure:3"
    mem_limit: 4g
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=128m"]
    expose: ["8000"]
    volumes: ["asr-en-models:/home/inference/models", "licence:/home/inference/license"]
    environment:
      MODEL_LANGUAGE: en
      MODEL_REVISION: 3c52c6e6c9ec508014a7b9db6a42b503b8930dff
      MODEL_THREADS: "4"
      HF_HOME: /home/inference/models/hf
      VERIFIED_MODEL_CACHE: /home/inference/models/verified
      LICENSE_DB: /home/inference/license/usage.sqlite
      HF_TOKEN: ${HF_TOKEN:-}
      MODEL_BUCKET_ID: Blockcapitol/NigerianAccentedEnglish-bucket
      MODEL_BUCKET_PREFIX: ""
      ASR_SERVICE_TOKEN: ${ASR_SERVICE_TOKEN:?Set privately}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60m
volumes:
  licence:
  caddy-data:
  caddy-config:
  asr-en-models:
